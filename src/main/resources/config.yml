# ----- BestTools -----

# BestTools lets you automatically use the best tool you have in your inventory
# when breaking blocks or attacking mobs. It also features automatic hotbar
# refill when you run out of blocks.


# ----- Commands -----

# /bestesttool (or /bt:)          Toggle BestTools per player
# /bestesttool hotbaronly [<state>]  Toggles (or sets) whether BestTools only uses tools from your hotbar
# /bestesttool refill [<state>]:  Toggle (or set) automatic hotbar refill per player (aliases /refill, /rf)
# /bestesttool admin reload:            Reloads the config file
# /bestesttool admin debug [<state>]:   Toggle (or set) debug mode
# /bestesttool admin selftest start|next|status|stop: Run the live in-game self-test (needs
#                                  enable_selftest below, plus the bestesttool.admin.selftest permission)
# /bestesttool admin benchmark start|stop|status: Run the synthetic tool-selection benchmark (needs
#                                  enable_benchmark below, plus the bestesttool.admin.benchmark permission)
#
# Boolean toggles above accept an optional state argument: yes/no, true/false, on/off, enable/disable

# /bestesttool blacklist                      Shows your blacklist
# /bestesttool blacklist add                  Adds your current item to your blacklist
# /bestesttool blacklist add <items...>       Adds all specified items to your blacklist
# /bestesttool blacklist add inventory        Adds all items in your inventory to your blacklist
# /bestesttool blacklist add hotbar           Adds all items in your hotbar to your blacklist
# /bestesttool blacklist remove               Removes your current item from your blacklist
# /bestesttool blacklist remove <items...>    Removes all specified items from your blacklist
# /bestesttool blacklist remove inventory     Removes all items in your inventory from your blacklist
# /bestesttool blacklist remove hotbar        Removes all items in your hotbar from your blacklist
# /bestesttool blacklist reset                Removes all items from your blacklist

# /bestesttool swordsforleaves [<state>]:     Toggle (or set) using swords as a leaf-breaking fallback
# /bestesttool swordsforcobwebs [<state>]:    Toggle (or set) using swords as a cobweb-breaking fallback
# /bestesttool switchduringbattle [<state>]:  Toggle (or set) whether BestTools keeps switching tools
#                                  while you hold a sword/bow/crossbow/trident
# /bestesttool combat swordonmobs [<state>]:  Toggle (or set) switching to your best sword/axe when
#                                  attacking mobs (needs allow_combat_switching below, plus the
#                                  bestesttool.combat permission)
# /bestesttool combat useaxeassword [<state>]: Toggle (or set) preferring an axe over a sword when
#                                  attacking, if the axe hits harder (same requirements as above)


# ----- Permissions -----

# bestesttool.use:      (default: true)  Allows using /bestesttool (or /bt), including hotbar,
#                        favoriteslot, the blacklist subcommands, and every preference above except
#                        the combat subtree
# bestesttool.combat:   (default: true)  Allows /bestesttool combat and weapon-switching when
#                        attacking mobs (also needs allow_combat_switching below)
# bestesttool.refill:   (default: true)  Allows using /bestesttool refill (or /refill, /rf)
# bestesttool.admin.reload:   (default: op)    Allows using /bestesttool admin reload
# bestesttool.admin.debug:    (default: op)    Allows enabling debug mode via /bestesttool admin debug
# bestesttool.admin.selftest: (default: op)    Allows running /bestesttool admin selftest (also needs
#                        enable_selftest below)
# bestesttool.admin.benchmark:(default: op)    Allows running /bestesttool admin benchmark (also needs
#                        enable_benchmark below)


# ----- Placeholders -----

# When using PlaceholderAPI, you can use the following placeholders:

# %bestesttool_btenabled%    - true if this player has BestTools enabled, otherwise false
# %bestesttool_rfenabled%    - true if this player has Refill enabled, otherwise false
# %bestesttool_hotbaronly%   - true if this player has set BestTools to hotbar-only
# %bestesttool_favoriteslot% - the slot number this player chose as favorite slot


# ----- Default settings -----

# Default preferences applied to new players (or any player whose PDC entry is missing).
defaults:
  # When false, new players have to run /bestesttool or /bt once to enable BestTools
  enabled: false

  # When false, new players have to run /bestesttool refill (or /refill, /rf) once to enable
  # hotbar refill
  refill_enabled: false

  # Only use tools from the hotbar? Can be changed per player using /bestesttool hotbaronly
  hotbar_only: true

  # The preferred slot where BestTools should move the tool if it's not in the hotbar
  # and hotbar_only is set to false. Must be a number between 0 (leftmost hotbar slot)
  # and 8 (rightmost hotbar slot), or -1 to always use the player's current slot.
  favorite_slot: 8

  # Allow /bestesttool to switch to your sword/axe (whatever is better) when attacking mobs?
  # Can be changed per player using /bestesttool combat swordonmobs (needs allow_combat_switching
  # below and the bestesttool.combat permission).
  sword_on_mobs: true

  # Use axe instead of sword when the axe does more damage (it's slower though and does not deal
  # sweep damage). Can be changed per player using /bestesttool combat useaxeassword (same
  # requirements as sword_on_mobs above).
  use_axe_as_sword: false

  # When true, BestTools keeps switching tools even while you're holding a sword, crossbow, bow,
  # or trident. When false (the default), it leaves your hand alone during a fight. This is NOT a
  # combat feature — it protects your held item regardless of allow_combat_switching/
  # bestesttool.combat below. Can be changed per player using /bestesttool switchduringbattle.
  switch_during_battle: false

  # The best tool for leaves are shears as only those give drops. BestTools will try to
  # use hoes instead if you don't have any shears. You can also make BestTools try to use
  # swords if you don't have both, however swords will take twice the damage when breaking
  # leaves with it. Can be changed per player using /bestesttool swordsforleaves.
  consider_swords_for_leaves: false

  # Uses swords for cobwebs if you don't have shears. Can be changed per player using
  # /bestesttool swordsforcobwebs.
  consider_swords_for_cobwebs: false


# ----- General config -----

# When set to false, /bestesttool (and /bestesttool refill) will only work in survival game mode
# When set to true, it works in survival and adventure game mode
allow_in_adventure_mode: false

# Master switch for BestTools' combat features: switching to your best sword/axe when you attack a
# mob (defaults.sword_on_mobs/defaults.use_axe_as_sword above, and /bestesttool combat ...). When
# false, the combat subtree is hidden from the command tree entirely and no weapon switching
# happens on attack — players' stored combat preferences are kept, just ignored. Players also need
# the bestesttool.combat permission (default: true). Does NOT affect switch_during_battle,
# consider_swords_for_leaves, or consider_swords_for_cobwebs above — none of those are combat
# features.
allow_combat_switching: true

# NOT IMPLEMENTED YET, comes with next update
# use-sword-on-friendly-mobs: false
# use-sword-on-players: false

# ----- Global blacklist -----

# BestTools already never switches tools/hands for blocks no tool can break or drop (bedrock,
# reinforced deepslate, barrier, portals, ...) or for decorated pots, where the held item is your
# own choice between an intact pot and 4 sherds — that list is built in and isn't editable here.
#
# You can add blocks to the global blacklist here that will apply to ALL players.
# Blocks broken that are mentioned in this list will not trigger BestTools.

# Example:
#
# global_block_blacklist:
# - POTATOES
# - BEETROOTS
# - CARROTS
# - WHEAT

global_block_blacklist: []

# ----- Update checker -----

# Checks for updates (asynchronously).
# When enabled, a message is printed in the console if a new
# version has been found, and OPs will be notified when they join the server
# When set to true, check for updates on startup and every X hours (see "check_for_updates_interval_hours" below)
# When set to on-startup, only check on server startup
# When set to false, don't check for updates
check_for_updates: true

# When you set "check_for_updates" to true, you can define the amount
# of hours inbetween each update check.
check_for_updates_interval_hours: 4

# ----- Localization -----

# Fallback locale (lowercase Minecraft-style token, e.g. en_us) used for console output and for
# any player locale with no matching file under plugins/BestestTool/lang/.
# All user-facing messages now live in plugins/BestestTool/lang/<locale>.yml (MiniMessage format)
# instead of this file — see that folder to customize or translate them.
default_locale: en_us

# ----- Technical stuff! -----

# Minimum milliseconds between a player's successive commands/blacklist edits. A value <= 0
# disables throttling. Players holding bestesttool.throttle.bypass are never throttled.
action_cooldown_ms: 150

# Send anonymous usage statistics to bStats (https://bstats.org).
# Set to false to opt out.
enable_metrics: true

# Logging verbosity for the plugin.
# Values: OFF (no debug output), DEBUG (high-level flow), TRACE (per-item verbose)
debug_level: 'OFF'

# Prints the Material<>Tool map to a csv file
dump: false

# Master switch for /bestesttool admin selftest, a live in-game correctness test: it forces the
# tester into survival mode, replaces their held item/inventory/blacklist with a fixed test kit,
# and builds (then removes) a small block arena next to them. Requires
# bestesttool.admin.selftest as well. Leave this false on production servers; turn it on only
# when you intend to run the test yourself.
enable_selftest: false

# Master switch for /bestesttool admin benchmark, a synthetic tool-selection speed test: it ramps
# a fixed, hardcoded workload against the selection routine until a tick blows its 50ms budget,
# then reports how many selections/tick the server can sustain. Requires
# bestesttool.admin.benchmark as well. Leave this false on production servers — a run
# deliberately blows the tick budget on purpose.
enable_benchmark: false
