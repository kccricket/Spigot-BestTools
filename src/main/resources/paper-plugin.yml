main: net.kccricket.bestesttool.Main
name: BestestTool
version: ${project.version}
api-version: "1.20.6"
description: Automatically chooses the best tool when breaking blocks
author: kccricket
prefix: BestestTool
folia-supported: true
dependencies:
  server:
    ChestSort:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
permissions:
  bestesttool:
    description: Umbrella node for all player-facing BestestTool features
    default: true
    children:
      bestesttool.use: true
      bestesttool.refill: true
  bestesttool.use:
    description: Automatic best-tool switching and the /bestesttool command
    default: true
  bestesttool.refill:
    description: Automatic hotbar refilling and /bestesttool refill (aliases /refill, /rf)
    default: true
  bestesttool.admin:
    description: Full admin control for BestestTool
    default: op
    children:
      bestesttool.reload: true
      bestesttool.debug: true
      bestesttool.selftest: true
      bestesttool.benchmark: true
  bestesttool.reload:
    description: Reload the config via /bestesttool reload
    default: op
  bestesttool.debug:
    description: Toggle debug mode via /bestesttool debug
    default: op
  bestesttool.selftest:
    description: Run the in-game self-test via /bestesttool selftest (also requires enable_selftest in config.yml)
    default: op
  bestesttool.benchmark:
    description: Run the tool-selection benchmark via /bestesttool benchmark (also requires enable_benchmark in config.yml)
    default: op
