# BestestTool internal English (en_us) language defaults.
#
# This file is the plugin's built-in source of truth for every user-facing message and is
# bundled inside the jar — it is NOT read from the plugin data folder, so editing a copy of it
# there has no effect. Changed defaults here take effect for every server on the next release
# automatically, with no admin action required.
#
# To customize strings for your server, edit plugins/BestestTool/lang/en_us.yml (or another
# locale file in that folder) instead: that file is sparse — only the keys you uncomment and
# edit are overridden; every other key keeps resolving to this internal default, so your
# customizations survive future releases that change unrelated defaults.
#
# All values are rendered with MiniMessage (https://docs.advntr.dev/minimessage).
# You may use color/formatting tags such as <white>, <red>, <bold>, etc.
# Edits (to an on-disk override file) take effect after running /bestesttool reload.
#
# Placeholder tags are listed in comments above each message that accepts one.
# Do not remove a placeholder from a message that requires it.

# Prepended to every message sent via Messenger's .error()/.status()/.alert() severities
# (not .raw()) — see net.kccricket.kcmclib.text.Messenger.
prefix: "<gray>[<aqua>BestestTool<gray>] "

# Command feedback — /bestesttool toggle
besttoolsEnabled: "<gray>BestTools has been <green>enabled</green>.</gray>"
besttoolsDisabled: "<gray>BestTools has been <red>disabled</red>.</gray>"

# Command feedback — /bestesttool refill (aliases /refill, /rf) toggle
refillEnabled: "<gray>Refill has been <green>enabled</green>.</gray>"
refillDisabled: "<gray>Refill has been <red>disabled</red>.</gray>"

# One-time hint shown the first time BestTools/Refill would have acted for a player who hasn't
# enabled the feature yet.
besttoolsUsage: "<gray>Hint: Type <gold>/bestesttool</gold> or <gold>/bt</gold> to automatically use the best tool when breaking blocks.</gray>"
refillUsage: "<gray>Hint: Type <gold>/refill</gold> or <gold>/rf</gold> to automatically refill empty items from your inventory.</gray>"

# Command feedback — /bestesttool hotbaronly toggle
hotbarOnlyEnabled: "<gray>BestTools will only use tools from your hotbar.</gray>"
hotbarOnlyDisabled: "<gray>BestTools will use all tools from your inventory.</gray>"

# Command feedback — /bestesttool favoriteslot
# Placeholder: <slot>
favoriteSlotSet: "<gray>BestTools will place tools in hotbar slot <gold><slot></gold>.</gray>"
favoriteSlotHeld: "<gray>BestTools will place tools in whichever slot you're holding.</gray>"

# Command feedback — /bestesttool swordsforleaves toggle
swordsForLeavesEnabled: "<gray>BestTools will use a sword to break leaves if you have no shears.</gray>"
swordsForLeavesDisabled: "<gray>BestTools will no longer use a sword to break leaves.</gray>"

# Command feedback — /bestesttool swordsforcobwebs toggle
swordsForCobwebsEnabled: "<gray>BestTools will use a sword to break cobwebs if you have no shears.</gray>"
swordsForCobwebsDisabled: "<gray>BestTools will no longer use a sword to break cobwebs.</gray>"

# Command feedback — /bestesttool switchduringbattle toggle
switchDuringBattleEnabled: "<gray>BestTools will keep switching tools even while you hold a weapon.</gray>"
switchDuringBattleDisabled: "<gray>BestTools will leave your hand alone while you hold a weapon.</gray>"

# Command feedback — /bestesttool combat swordonmobs toggle (needs allow_combat_switching in
# config.yml and the bestesttool.combat permission — otherwise the node is hidden entirely
# rather than answered with a message, same as admin reload/debug/selftest/benchmark)
swordOnMobsEnabled: "<gray>BestTools will switch to your best sword/axe when attacking mobs.</gray>"
swordOnMobsDisabled: "<gray>BestTools will no longer switch weapons when attacking mobs.</gray>"

# Command feedback — /bestesttool combat useaxeassword toggle (same requirements as swordonmobs)
useAxeAsSwordEnabled: "<gray>BestTools will prefer an axe over a sword when it hits harder.</gray>"
useAxeAsSwordDisabled: "<gray>BestTools will no longer prefer an axe over a sword.</gray>"

# Blacklist command feedback
blacklistEmpty: "<gray>Your blacklist is empty.</gray>"
# Placeholder: <items>
blacklistAdded: "<dark_green>Added to blacklist:</dark_green> <gray><items></gray>"
# Placeholder: <items>
blacklistInvalid: "<dark_red>Invalid items:</dark_red> <gray><items></gray>"
# Placeholder: <items>
blacklistRemoved: "<dark_green>Removed from blacklist:</dark_green> <gray><items></gray>"
blacklistCleared: "<dark_green>Your blacklist has been cleared.</dark_green>"
blacklistNothingSpecified: "<gray>You must either hold an item in your hand or specify at least one material as a parameter.</gray>"
blacklistTitle: "----- <red>Blacklist</red> -----"

# Shared command feedback
# Placeholder: <plugin>
noPermission: "<yellow><plugin>: you don't have permission to use this command.</yellow>"
notAPlayer: "You must be a player to run this command."
# Placeholder: <plugin>
reloaded: "<green><plugin> has been reloaded.</green>"
# Placeholders: <value>, <valid> — sent when a boolean toggle's optional [<state>] argument
# (e.g. /bestesttool refill <state>) isn't one of the recognized yes/no words.
invalidValue: "<red>Invalid value '<value>'. Valid values: <valid>.</red>"

# /bestesttool debug toggle
# Placeholder: <plugin>
debugEnabled: "<red><plugin> debug mode has been enabled.</red>"
debugDisabled: "<green><plugin> debug mode has been disabled.</green>"

# /bestesttool selftest
# Note: there's no "disabled"/"noPermission" message for selftest itself — like reload/debug, it's
# gated with .requires(...) in BestToolsCommands so the subcommand is hidden entirely (and fails to
# parse) rather than answered with a chat message, for anyone lacking enable_selftest/the permission.
selfTestNoStagesConfigured: "<red>No self-test stages are configured (selftest/stages.yml is empty or failed to load).</red>"
selfTestBackupRestored: "<yellow>Your inventory from an interrupted self-test run has been restored.</yellow>"
selfTestAlreadyRunning: "<yellow>You already have a self-test running. Use <gold>/bestesttool admin selftest stop</gold> to end it.</yellow>"
selfTestNoneRunning: "<gray>You don't have a self-test running.</gray>"
# Placeholder: <n>
selfTestNeedsSpace: "<red>Not enough clear space ahead of you to build the test arena (need <n> blocks in a line). Move somewhere more open and try again.</red>"
# Placeholders: <stage>, <total>
selfTestStarted: "<green>Self-test started</green> <gray>(stage <gold><stage></gold>, <total> case(s)). Break the marked blocks in order. Your inventory and game mode will be restored when you're done.</gray>"
# Placeholder: <stage>
selfTestUnknownStage: "<red>Unknown stage '<stage>'.</red>"
# Placeholders: <block>, <expected>
selfTestCasePass: "<green>✔ <block></green> <gray>— correct (<expected>).</gray>"
# Placeholders: <block>, <expected>, <actual>
selfTestCaseFail: "<red>✘ <block></red> <gray>— expected <expected>, but you're holding <actual>.</gray>"
# Placeholders: <stage>, <passed>, <total>
selfTestStageComplete: "<gray>Stage <gold><stage></gold> complete: <passed>/<total> passed.</gray>"
# Placeholders: <passed>, <total>
selfTestFinished: "<green>Self-test finished:</green> <gray><passed>/<total> case(s) passed. Everything has been restored.</gray>"
selfTestStopped: "<gray>Self-test stopped. Everything has been restored.</gray>"
# Placeholders: <stage>, <remaining>
selfTestStatus: "<gray>Stage <gold><stage></gold>: <remaining> case(s) remaining.</gray>"

# /bestesttool benchmark
# Note: there's no "disabled"/"noPermission" message for benchmark itself — like reload/debug, it's
# gated with .requires(...) in BestToolsCommands so the subcommand is hidden entirely (and fails to
# parse) rather than answered with a chat message, for anyone lacking enable_benchmark/the permission.
# Placeholder: <kit>
benchmarkStarted: "<green>Benchmark started</green> <gray>(kit: <gold><kit></gold>). Ramping tool selections per tick until a batch exceeds the 50ms tick budget.</gray>"
# Placeholders: <n>, <ms>, <nspersel>
benchmarkTick: "<gray>batch <gold><n></gold>: <ms>ms (<nspersel> ns/selection)</gray>"
benchmarkAlreadyRunning: "<yellow>A benchmark is already running. Use <gold>/bestesttool admin benchmark stop</gold> to end it.</yellow>"
benchmarkNoneRunning: "<gray>No benchmark is currently running.</gray>"
benchmarkStopped: "<gray>Benchmark stopped.</gray>"
# Placeholders: <n>, <ms>
benchmarkStatus: "<gray>Benchmark running: last completed batch <gold><n></gold> in <ms>ms.</gray>"
# Placeholders: <kit>, <peak>, <nspersel>, <pertick>
benchmarkFinished: "<green>Benchmark finished</green> <gray>(kit: <gold><kit></gold>). Peak batch under 50ms: <gold><peak></gold> selections (<nspersel> ns/selection) — sustainable rate: <gold>~<pertick></gold> selections/tick.</gray>"

# Rate-limited notice (at most once per few seconds) shown when a player's commands/blacklist
# edits are being throttled by action_cooldown_ms.
actionTooFast: "<red>Slow down — you're acting too quickly."
